version: "3.8"

services:
  peerlearn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peerlearn-school-server
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - peerlearn_data:/app/data

volumes:
  peerlearn_data:
